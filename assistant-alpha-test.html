<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MACA Alpha V2 — Test</title><style>body{margin:0;background:#faf7ef;font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:#263936}.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e4ded3;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}.bar strong{font-size:13px}.bar button{border:0;border-radius:999px;padding:9px 13px;background:#8b4350;color:#fff;font-weight:700}.meta{font-size:12px;color:#687873}iframe{display:block;width:100%;height:calc(100vh - 58px);border:0}</style></head><body><div class="bar"><div><strong>Alpha-test MACA V2</strong><div id="count" class="meta">0 essai enregistré</div></div><button id="share">Partager les retours</button></div><iframe id="alpha" src="assistant-alpha.html" title="Assistant MACA Alpha V2"></iframe><script>(function(){'use strict';const KEY='maca-alpha-v2-feedback';const SIDKEY='maca-alpha-v2-session';const frame=document.getElementById('alpha');const count=document.getElementById('count');let active=null;let session=localStorage.getItem(SIDKEY);if(!session){session='T-'+Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem(SIDKEY,session);}function logs(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}function save(all){localStorage.setItem(KEY,JSON.stringify(all));count.textContent=all.length+' essai'+(all.length>1?'s':'')+' enregistré'+(all.length>1?'s':'');}function push(entry){const all=logs();all.push(entry);save(all);return all.length-1;}function patch(i,data){const all=logs();if(!all[i])return;Object.assign(all[i],data);save(all);}save(logs());frame.addEventListener('load',()=>{const d=frame.contentDocument;const form=d.getElementById('form');if(!form)return;form.addEventListener('submit',()=>{const q=d.getElementById('alpha-query').value.trim();if(!q)return;setTimeout(()=>{const choices=[...d.querySelectorAll('#choices button')].map(b=>b.textContent.replace(/\s*→\s*$/,'').trim());const bot=d.getElementById('bot2').textContent||'';const none=/pas trouvé|n'a pas trouvé/i.test(bot)||choices.length===0;active=push({session,at:new Date().toISOString(),query:q,status:none?'no_match':'match',proposals:choices,selected:null,vote:null});},50);},true);d.getElementById('choices').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||active===null)return;patch(active,{selected:b.textContent.replace(/\s*→\s*$/,'').trim()});});d.querySelectorAll('[data-vote]').forEach(b=>b.addEventListener('click',()=>{if(active!==null)patch(active,{vote:b.dataset.vote});},true));});document.getElementById('share').addEventListener('click',async()=>{const all=logs();const payload=JSON.stringify({macaAlpha:'V2',session,exportedAt:new Date().toISOString(),tests:all},null,2);if(navigator.share){try{await navigator.share({title:'Retours alpha MACA V2',text:payload});return}catch(e){}}const blob=new Blob([payload],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='maca-alpha-retours-'+session+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});})();</script></body></html>
