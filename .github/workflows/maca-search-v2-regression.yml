name: MACA Search V2 Regression

on:
  push:
    branches:
      - feat/search-v2-p0-20260831
    paths-ignore:
      - docs/MACA_V2_REGRESSION_RESULT.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/search-v2-p0-20260831

      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maca-http.log 2>&1 &
          echo $! >/tmp/maca-http.pid
          sleep 1

      - name: Run canonical corpus regression in Chrome
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -u
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          CHROME_EXIT=0
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner"
            CHROME_EXIT=2
            : > /tmp/maca-v2-dom.html
          else
            "$CHROME" \
              --headless=new \
              --disable-gpu \
              --no-sandbox \
              --disable-dev-shm-usage \
              --virtual-time-budget=20000 \
              --dump-dom \
              "http://127.0.0.1:8765/search-v2-lab.html?autorun=1" \
              > /tmp/maca-v2-dom.html || CHROME_EXIT=$?
          fi
          export CHROME_EXIT

          python3 - <<'PY'
          import datetime, html, json, os, re
          dom = open('/tmp/maca-v2-dom.html', encoding='utf-8', errors='replace').read()
          m = re.search(r'<pre id="machine-result"[^>]*>(.*?)</pre>', dom, re.S)
          if m:
              raw = html.unescape(re.sub(r'<[^>]+>', '', m.group(1))).strip()
              try:
                  data = json.loads(raw)
              except Exception as exc:
                  data = {'ready': False, 'error': f'Invalid machine JSON: {exc}', 'raw': raw[:2000]}
          else:
              data = {'ready': False, 'error': 'Machine result not found in DOM'}
          data['testedSha'] = os.environ.get('TESTED_SHA')
          data['chromeExit'] = int(os.environ.get('CHROME_EXIT', '0'))
          data['executedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          data['success'] = bool(data.get('ready') and data.get('total') == 120 and data.get('failed') == 0 and data['chromeExit'] == 0)
          os.makedirs('docs', exist_ok=True)
          with open('docs/MACA_V2_REGRESSION_RESULT.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Persist regression result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MACA_V2_REGRESSION_RESULT.json
          git diff --cached --quiet && exit 0
          git commit -m "test: enregistrer résultat régression V2 [skip ci]"
          git push origin HEAD:feat/search-v2-p0-20260831

      - name: Fail workflow if regression failed
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          data=json.load(open('docs/MACA_V2_REGRESSION_RESULT.json', encoding='utf-8'))
          if not data.get('success'):
              sys.exit(1)
          PY
