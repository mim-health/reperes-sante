name: MACA Search V2 UI Validation

on:
  push:
    branches:
      - feat/search-v2-ui-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branche UI V2
        uses: actions/checkout@v4
        with:
          ref: feat/search-v2-ui-20260831

      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maca-http.log 2>&1 &
          echo $! >/tmp/maca-http.pid
          sleep 1

      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "No Chrome/Chromium executable found"; exit 2; }
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Run 120 V2 regression tests
        run: |
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=20000 --dump-dom \
            "http://127.0.0.1:8765/search-v2-lab.html?autorun=1" > /tmp/v2-regression.html
          python3 - <<'PY'
          import html, json, re, sys
          dom=open('/tmp/v2-regression.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="machine-result"[^>]*>(.*?)</pre>',dom,re.S)
          if not m:
              print('Machine result missing'); sys.exit(1)
          raw=html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip()
          data=json.loads(raw)
          print('V2_REGRESSION_RESULT='+json.dumps(data,ensure_ascii=False))
          if not (data.get('ready') and data.get('total')==120 and data.get('failed')==0): sys.exit(1)
          PY

      - name: Functional search — desktop
        run: |
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --window-size=1440,1000 --virtual-time-budget=25000 --dump-dom \
            "http://127.0.0.1:8765/search-v2-ui-functional.html" > /tmp/v2-ui-desktop.html
          python3 - <<'PY'
          import html, json, re, sys
          dom=open('/tmp/v2-ui-desktop.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="machine-result"[^>]*>(.*?)</pre>',dom,re.S)
          if not m: print('Desktop machine result missing'); sys.exit(1)
          data=json.loads(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip())
          print('V2_UI_DESKTOP_RESULT='+json.dumps(data,ensure_ascii=False))
          if not data.get('success'): sys.exit(1)
          PY

      - name: Functional search — mobile
        run: |
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=25000 --dump-dom \
            "http://127.0.0.1:8765/search-v2-ui-functional.html" > /tmp/v2-ui-mobile.html
          python3 - <<'PY'
          import html, json, re, sys
          dom=open('/tmp/v2-ui-mobile.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="machine-result"[^>]*>(.*?)</pre>',dom,re.S)
          if not m: print('Mobile machine result missing'); sys.exit(1)
          data=json.loads(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip())
          print('V2_UI_MOBILE_RESULT='+json.dumps(data,ensure_ascii=False))
          if not data.get('success'): sys.exit(1)
          PY
