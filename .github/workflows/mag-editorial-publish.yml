name: Mag validated editorial publication
on:
  push:
    branches: [feat/v0-magazine, fix/editorial-auto-publish-20261110]
    paths:
      - 'scripts/editorial-*.js'
      - 'scripts/test-editorial-publish.js'
      - 'editorial/fiches.json'
      - 'editorial/publication-requests/**'
      - '*.js'
      - '.github/workflows/build-static-seo-fiches.yml'
      - 'scripts/build-corpus-production.js'
      - 'scripts/build-static-seo-fiches.js'
      - 'scripts/build-sitemap-from-corpus.js'
      - 'qa-data*.js'
      - 'backlog-audited*.js'
      - 'corpus-*.js'
      - 'migration-*.js'
      - 'scripts/verify-publication.js'
      - 'scripts/test-fiche-fast-load.js'
      - 'notre-histoire.html'
      - 'fiches.html'
      - 'fiche.html'
      - 'maca-site-shell.css'
      - 'maca-site-shell.js'
      - 'scripts/site-shell.js'
      - 'scripts/test-site-shell.js'
      - 'index.html'
      - 'maca-home-assistant.css'
      - 'maca-home-assistant.js'
      - 'assets/home/**'
      - 'credits-photos.html'
      - 'scripts/test-home-assistant.js'
      - 'editorial/content.json'
      - 'editorial/catchup.json'
      - 'editorial/reviewed-corpus-overrides.json'
      - 'editorial-sfe-2026-10-11.json'
      - 'scripts/audit-content-duplicates.js'
      - 'scripts/audit-mag-images.js'
      - 'scripts/theme-taxonomy.js'
      - 'scripts/build-theme-hubs.js'
      - 'scripts/test-theme-hubs.js'
      - 'scripts/approved-title-recurrences.js'
      - 'scripts/test-content-duplicates.js'
      - 'scripts/mag-editorial.js'
      - 'scripts/test-mag-editorial.js'
      - 'scripts/audit-mag-images.js'
      - 'scripts/publish-mag-generated.sh'
      - 'scripts/verify-mag-public.js'
      - 'corpus-v2-browser-entry.js'
      - 'maca-assistant-v2-unified.js'
      - 'maca-assistant-metrics.js'
      - 'scripts/test-assistant-pilot.js'
      - 'confidentialite.html'
      - 'ipp-retrieval-policy.js'
      - 'search-v2-corpus-fallback.js'
      - 'scripts/test-ipp-retrieval.js'
      - 'search-v2-retrouvabilite-pilot-fix.js'
      - '.github/workflows/mag-editorial-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  prepare:
    name: A — Validation et préparation
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      fingerprint: ${{ steps.commit.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and prepare approved sources
        env:
          PUBLICATION_BASE_SHA: ${{ github.event.before }}
        run: node scripts/editorial-pipeline.js prepare
      - name: Commit generated outputs safely
        if: github.ref == 'refs/heads/feat/v0-magazine'
        run: bash scripts/publish-mag-generated.sh
      - id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(node -p "require('./scripts/editorial-pipeline').sourceVersion()")" >> "$GITHUB_OUTPUT"
      - name: Assemble public site without private preparation files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='media-publishing' --exclude='scripts' --exclude='_site' --exclude='.maca-lab' --exclude='editorial/drafts' --exclude='editorial/publication-requests' --exclude='editorial/fiches.json' --exclude='publication-report.json' --exclude='publication-plan.json' --exclude='assistant-v2/corpus.json' --exclude='assistant-v2/corpus.report.json' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-stage-a
          path: |
            publication-report.json
            publication-plan.json
            editorial/manifest.json
  deploy:
    name: B — Publication et vérification publique
    if: github.ref == 'refs/heads/feat/v0-magazine'
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: pages-site-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refuse superseded medical sources before deploy
        env:
          EXPECTED: ${{ needs.prepare.outputs.fingerprint }}
        run: |
          git fetch origin feat/v0-magazine
          ACTUAL=$(node -p "require('./scripts/editorial-pipeline').sourceVersion('origin/feat/v0-magazine')")
          test "$ACTUAL" = "$EXPECTED" || { echo 'Source changed; this obsolete build must not deploy'; exit 1; }
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public versions, archives, sitemap and historical fiches
        run: node scripts/editorial-pipeline.js verify
      - name: Record a distinct deployment or verification failure
        if: failure()
        run: node scripts/editorial-pipeline.js report PUBLICATION_FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-stage-b
          path: publication-report.json
  assistant:
    name: C — Synchronisation IA indépendante du déploiement
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    concurrency:
      group: assistant-index-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate corpus, reuse unchanged vectors, publish and verify active index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MACA_EMBEDDING_MODEL: text-embedding-3-small
          MACA_EMBEDDING_DIMENSIONS: '512'
          GITHUB_REF_NAME: feat/v0-magazine
        run: node scripts/editorial-pipeline.js assistant
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-stage-c
          path: publication-report.json
