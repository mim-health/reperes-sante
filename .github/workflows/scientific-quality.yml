name: MACA Scientific Quality
on:
  schedule:
    - cron: '15 6 * * 1-5'
  workflow_dispatch:
  push:
    branches: [feat/v0-magazine]
    paths: ['scripts/scientific-quality.js','scripts/test-scientific-quality.js','.github/workflows/scientific-quality.yml','editorial/scientific-quality/reviews/**','editorial/fiches.json']
permissions:
  contents: write
concurrency:
  group: maca-scientific-quality
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0-magazine
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-scientific-quality.js
      - run: node scripts/editorial-publish.js fiches
      - run: node scripts/scientific-quality.js
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-quality-registry
          path: |
            editorial/scientific-quality/registry.json
            editorial/scientific-quality/dashboard.json
            editorial/scientific-quality/DASHBOARD.md
      - name: Persist registry without changing medical content
        run: |
          git config user.name 'MACA Quality Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add editorial/scientific-quality/registry.json editorial/scientific-quality/dashboard.json editorial/scientific-quality/DASHBOARD.md
          git diff --cached --quiet || git commit -m 'quality: refresh canonical scientific audit queue'
          git push origin HEAD:feat/v0-magazine
