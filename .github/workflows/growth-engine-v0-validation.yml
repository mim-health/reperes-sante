name: MACA Growth Engine V0 validation

on:
  pull_request:
    paths:
      - "maca-growth-*.js"
      - "scripts/growth-*.js"
      - "growth-*.html"
      - ".github/workflows/growth-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: |
          node --check maca-growth-engine-v0.js
          node --check maca-growth-radar-v0.js
          node --check maca-growth-ingest-v0.js
          node --check maca-growth-assistant-adapter-v0.js
          node --check scripts/growth-reddit-collector-v0.js
          node --check scripts/growth-digest-v0.js
      - name: Privacy guardrails
        run: |
          ! grep -Eiq '"author"|"username"|"user_id"|"ip_address"|"cookie"' scripts/growth-reddit-collector-v0.js
      - name: No automatic publishing
        run: |
          ! grep -Eiq 'submit|comment|publish|POST.+reddit' scripts/growth-reddit-collector-v0.js

  live-readonly-probe:
    runs-on: ubuntu-latest
    needs: static-validation
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect public Reddit candidates
        env:
          GROWTH_SUBREDDITS: "ParentingFR,AskFrance"
          GROWTH_REDDIT_LIMIT: "15"
          GROWTH_USER_AGENT: "MACASante-GrowthRadar-validation/0.1"
        run: node scripts/growth-reddit-collector-v0.js
      - name: Validate minimized output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('growth-input.json','utf8'));
          if(!Array.isArray(a)) throw new Error('output-not-array');
          for(const x of a){
            for(const forbidden of ['author','username','user_id','ip','cookie']) if(Object.hasOwn(x,forbidden)) throw new Error('forbidden-field:'+forbidden);
            if(String(x.question||'').length>600) throw new Error('question-too-long');
          }
          console.log('Candidates:',a.length,'— privacy output OK');
          NODE
