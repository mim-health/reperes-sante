name: assistant v2 perf safety

on:
  push:
    branches:
      - perf/assistant-v2-grounding-compact-20260923
    paths:
      - 'assistant-v2/cloudflare-worker-public.js'
      - '.github/workflows/assistant-v2-perf-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check assistant-v2/cloudflare-worker-public.js
      - name: Safety invariants
        run: |
          set -euo pipefail
          f=assistant-v2/cloudflare-worker-public.js
          grep -q "const TOP_K=5" "$f"
          grep -q "const MIN_GATE=0.30" "$f"
          grep -q "personalized_request" "$f"
          grep -q "forbidden=" "$f"
          grep -q "GROUNDING_PROMPT" "$f"
          grep -q "supported===true" "$f"
          grep -q "RATE_LIMITER" "$f"
          grep -q "RATE_LIMIT_SALT" "$f"
          grep -q "artifact_version" "$f"
          if grep -q "ARTIFACT_COMMIT" "$f"; then echo 'Frozen artifact pointer reintroduced'; exit 1; fi
          echo 'Safety invariants preserved'
