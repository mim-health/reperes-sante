name: assistant v2 Alzheimer targeted P0

on:
  push:
    branches:
      - fix/assistant-v2-artifacts-sync-20260923
    paths:
      - '.github/workflows/assistant-v2-alzheimer-targeted-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rank exact public query against rebuilt embeddings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const idx=JSON.parse(fs.readFileSync('assistant-v2/embeddings.index.json','utf8'));
          const corpus=JSON.parse(fs.readFileSync('assistant-v2/corpus.json','utf8'));
          const query='Une prise de sang peut-elle rechercher Alzheimer ?';
          const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
          const norm=a=>Math.sqrt(dot(a,a));
          const cosine=(a,b)=>dot(a,b)/(norm(a)*norm(b));
          (async()=>{
            if(!process.env.OPENAI_API_KEY) throw new Error('OPENAI_API_KEY missing');
            const r=await fetch('https://api.openai.com/v1/embeddings',{method:'POST',headers:{Authorization:`Bearer ${process.env.OPENAI_API_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({model:idx.model,input:[query],dimensions:idx.dimensions,encoding_format:'float'})});
            if(!r.ok) throw new Error('embedding HTTP '+r.status);
            const q=(await r.json()).data[0].embedding;
            const byId=new Map(corpus.cards.map(c=>[c.id,c]));
            const top=idx.vectors.map(v=>({id:v.id,score:cosine(q,v.vector)})).sort((a,b)=>b.score-a.score).slice(0,5);
            console.log(JSON.stringify(top.map(x=>({...x,title:byId.get(x.id)?.title})),null,2));
            const rank=top.findIndex(x=>x.id==='prise-sang-diagnostic-alzheimer');
            if(rank<0) throw new Error('Dedicated Alzheimer blood-test card not in semantic top 5');
            console.log('TARGETED_P0_OK rank='+(rank+1));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
