name: Publish validated Mag videos
on:
  push:
    branches: [feat/v0-magazine]
    paths: ['media-publishing/**', 'scripts/publish-mag-video.py', 'scripts/import-mag-video-source.js', 'scripts/verify-mag-video-public.py', '.github/workflows/publish-mag-video.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-site-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0-magazine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify original bytes and full decoding, then generate pages
        run: python3 scripts/publish-mag-video.py
      - name: Validate archive, fiche links and sitemap
        run: |
          node scripts/build-sitemap-from-corpus.js
          node scripts/test-magazine-videos.js
      - name: Publish assets and pages atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/videos magazine-videos.js magazine-articles.js magazine.html video-*.html sitemap.xml editorial/content.json editorial/manifest.json editorial/candidate-fiches.json index.html fiches.html fiche.html daily.html maca-daily-editorial-data.js maca-editorial-history.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'media: publish validated videos with verified original bytes'
          for attempt in 1 2 3; do
            git push origin HEAD:feat/v0-magazine && exit 0
            git fetch origin feat/v0-magazine
            git rebase origin/feat/v0-magazine || exit 1
          done
          exit 1
      - name: Assemble public site without transfer fragments
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='media-publishing' --exclude='scripts' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy verified site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public original bytes and permanent page
        run: python3 scripts/verify-mag-video-public.py
      - name: Synchronize closed Assistant after verified site publication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MACA_EMBEDDING_MODEL: text-embedding-3-small
          MACA_EMBEDDING_DIMENSIONS: '512'
          GITHUB_REF_NAME: feat/v0-magazine
        run: |
          node scripts/build-assistant-v2-corpus.js
          node - <<'JS'
          const fs=require('fs'),l=JSON.parse(fs.readFileSync('assistant-v2/latest.json','utf8'));
          const p='assistant-v2/public-artifacts/'+l.version+'/embeddings.index.json';
          if(fs.existsSync(p))fs.copyFileSync(p,'assistant-v2/embeddings.index.json');
          JS
          node scripts/build-assistant-v2-embeddings.js
          bash scripts/publish-assistant-v2.sh
          node scripts/verify-mag-public.js --assistant
