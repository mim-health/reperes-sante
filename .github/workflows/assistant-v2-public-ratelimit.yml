name: assistant v2 public rate-limit
on:
  pull_request:
    branches: [feat/v0-magazine]
  workflow_dispatch:
jobs:
  ratelimit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify real HTTP 429
        run: |
          node - <<'NODE'
          const endpoint='https://purple-voice-a8e3.dr-beddok.workers.dev/';
          let got429=false;
          for(let i=1;i<=25;i++){
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://macasante.fr'},body:'{}'});
            console.log(i,r.status);
            if(r.status===429){ got429=true; break; }
            if(r.status!==400) throw new Error('Unexpected status before limit: '+r.status);
          }
          if(!got429) throw new Error('No HTTP 429 observed within 25 requests');
          console.log('Rate limiter: HTTP 429 confirmed.');
          NODE
