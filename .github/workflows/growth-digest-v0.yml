name: MACA Growth Digest V0

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/growth-engine-v0-20261002
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build daily Growth digest
        run: node scripts/growth-digest-v0.js
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: maca-growth-digest
          path: |
            growth-digest-latest.json
            growth-digest-latest.md
          retention-days: 14
