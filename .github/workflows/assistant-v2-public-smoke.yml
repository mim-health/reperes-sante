name: assistant v2 public smoke
on:
  pull_request:
    branches: [feat/v0-magazine]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public readiness handshake
        run: |
          node - <<'NODE'
          const endpoint='https://purple-voice-a8e3.dr-beddok.workers.dev/';
          const r=await fetch(endpoint+'?maca_public_ready=1',{headers:{Origin:'https://macasante.fr'}});
          const d=await r.json();
          console.log(r.status,d);
          if(!r.ok||d.service!=='maca-assistant-v2'||d.public_ready!==true) process.exit(1);
          NODE
      - name: Public question smoke test
        run: |
          node - <<'NODE'
          const endpoint='https://purple-voice-a8e3.dr-beddok.workers.dev/';
          const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://macasante.fr'},body:JSON.stringify({question:'Le magnésium aide-t-il vraiment à dormir ?'})});
          const d=await r.json();
          console.log(r.status,d.status,d.error||'',d.cards_used?.map(x=>x.title)||[]);
          if(!r.ok||!['answer','category_only','abstain'].includes(d.status)) process.exit(1);
          NODE
      - name: Verify live patient-language retrieval
        run: |
          node - <<'NODE'
          const endpoint='https://purple-voice-a8e3.dr-beddok.workers.dev/';
          const cases=[
            ['nycturie','nycturie-levers-nocturnes-uriner'],
            ['sciatique IRM','sciatique-irm-quand'],
            ['saignement après ménopause','saignement-apres-menopause']
          ];
          for(const [question,expectedId] of cases){
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://macasante.fr'},body:JSON.stringify({question})});
            const d=await r.json();
            console.log(JSON.stringify({question,http:r.status,status:d.status,artifact_version:d?.meta?.artifact_version,cards_used:d.cards_used,selected_cards:d.selected_cards}));
            if(!r.ok) throw new Error(question+': HTTP '+r.status);
            const selected=(d.selected_cards||[]).find(x=>x.id===expectedId);
            const used=(d.cards_used||[]).find(x=>x.id===expectedId);
            if(!selected) throw new Error(question+': expected card not selected');
            if(!used) throw new Error(question+': expected card not used');
            if(!(selected.retrieval_level<=3) || !selected.matched_alias) throw new Error(question+': live Worker does not expose deterministic patient-language retrieval');
          }
          NODE
