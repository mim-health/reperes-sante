name: MACA Assistant V1.5

on:
  push:
    branches:
      - feat/v0-magazine
    paths:
      - '.github/workflows/maca-assistant-v15-lab.yml'
      - 'scripts/audit-assistant-v15-initial.js'
      - 'scripts/test-assistant-v15-candidate.js'
      - 'scripts/benchmark-assistant-v15-expanded.js'
      - 'scripts/test-assistant-v15-viewmodel.js'
      - 'search-v15-lab-candidate.js'
      - 'assistant-v15-viewmodel-candidate.js'
      - 'assistant-alpha.html'
      - 'maca-assistant-widget.js'
      - 'corpus-v2-browser-entry.js'
      - 'index.html'
      - 'fiches.html'
      - 'search-v2-*.js'
      - 'corpus-manifest.js'
      - 'corpus-loader.js'
      - 'corpus-production.js'
      - 'corpus-canonicalizer.js'
      - 'qa-data*.js'
      - 'backlog-*.js'
      - 'maca-extra*.js'
      - 'migration-*.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v15-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Run Assistant V1.5 baseline audit
        run: node scripts/audit-assistant-v15-initial.js
      - name: Test V1.5 official search adapter and complements
        run: node scripts/test-assistant-v15-candidate.js
      - name: Run expanded real-language benchmark
        run: node scripts/benchmark-assistant-v15-expanded.js
      - name: Test V1.5 view model and production wiring
        run: node scripts/test-assistant-v15-viewmodel.js
