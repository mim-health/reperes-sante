name: assistant v2 performance probe

on:
  push:
    branches:
      - feat/v0-magazine
    paths:
      - '.github/workflows/assistant-v2-performance-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Measure readiness and three fixed public queries
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://purple-voice-a8e3.dr-beddok.workers.dev/'
          echo '=== readiness ==='
          curl -sS -o /tmp/ready.json -w 'HTTP=%{http_code} TOTAL=%{time_total} CONNECT=%{time_connect} TTFB=%{time_starttransfer}\n' "${ENDPOINT}?maca_public_ready=1"
          cat /tmp/ready.json
          echo

          run_query(){
            local label="$1"
            local q="$2"
            echo "=== ${label} ==="
            body=$(python3 -c 'import json,sys; print(json.dumps({"question":sys.argv[1]},ensure_ascii=False))' "$q")
            curl -sS -o "/tmp/${label}.json" \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://macasante.fr' \
              --data "$body" \
              -w 'HTTP=%{http_code} TOTAL=%{time_total} CONNECT=%{time_connect} TTFB=%{time_starttransfer}\n' \
              "$ENDPOINT"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print(json.dumps({"status":d.get("status"),"cards_used":[c.get("id") for c in d.get("cards_used",[])],"artifact_version":(d.get("meta") or {}).get("artifact_version"),"corpus_cards":(d.get("meta") or {}).get("corpus_cards"),"grounding":(d.get("meta") or {}).get("grounding"),"error":d.get("error")},ensure_ascii=False))' "/tmp/${label}.json"
            sleep 8
          }

          run_query q1 'Une prise de sang peut-elle rechercher Alzheimer ?'
          run_query q2 'Le magnésium aide-t-il vraiment à dormir ?'
          run_query q3 'Quels sont les meilleurs traitements naturels pour la maladie de Lyme chronique ?'
