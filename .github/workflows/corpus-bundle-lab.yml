name: corpus bundle lab

on:
  push:
    branches:
      - feat/v0-magazine
    paths:
      - '.github/workflows/corpus-bundle-lab.yml'
      - 'scripts/build-corpus-production.js'
      - 'scripts/test-corpus-bundle-equivalence.js'
      - 'scripts/diagnose-corpus-structure.js'
      - 'scripts/audit-seo-public-fiches.js'
      - 'sitemap.xml'
      - 'fiche-corpus-v2.js'
      - 'corpus-manifest.js'
      - 'qa-data*.js'
      - 'evidence-model.js'
      - 'audit-overrides.js'
      - 'backlog-*.js'
      - 'maca-extra*.js'
      - 'maca-daily-archive.js'
      - 'structured-backlog-compat.js'
      - 'migration-*.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corpus-bundle-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Build lab bundle
        run: node scripts/build-corpus-production.js

      - name: Verify strict corpus equivalence
        run: node scripts/test-corpus-bundle-equivalence.js

      - name: Diagnose corpus structure
        run: node scripts/diagnose-corpus-structure.js

      - name: Audit public fiche SEO
        run: node scripts/audit-seo-public-fiches.js

      - name: Show artifact sizes
        run: |
          wc -c .maca-lab/corpus-production.js
          cat .maca-lab/corpus-production.meta.json | head -40

      - name: Upload lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: maca-corpus-bundle-lab
          path: .maca-lab/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      - name: Publish validated bundle
        run: |
          cp .maca-lab/corpus-production.js corpus-production.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus-production.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged"
          else
            git commit -m "build(perf): publier le bundle corpus validé"
            git push origin HEAD:feat/v0-magazine
          fi
