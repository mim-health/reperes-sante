name: Question Graph V0 Privacy P0
on:
  pull_request:
    paths:
      - 'assistant-v2/cloudflare-worker-public.js'
      - 'assistant-v2/test-question-graph-privacy.mjs'
  workflow_dispatch:
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker syntax\n        run: node --check assistant-v2/cloudflare-worker-public.js\n      - name: Privacy minimization\n        run: node assistant-v2/test-question-graph-privacy.mjs\n      - name: V2 invariant checks\n        run: |\n          grep -q 'const TOP_K=5;' assistant-v2/cloudflare-worker-public.js\n          grep -q 'const MIN_GATE=0.30;' assistant-v2/cloudflare-worker-public.js\n          grep -q 'RATE_LIMITER' assistant-v2/cloudflare-worker-public.js\n          grep -q 'GROUNDING_PROMPT' assistant-v2/cloudflare-worker-public.js
