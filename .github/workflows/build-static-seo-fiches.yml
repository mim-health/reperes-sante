name: Build static SEO fiches

on:
  push:
    # Magazine SEO pages are generated within the atomic Mag deployment.
    # A second automatic writer could cancel a pending Magazine deployment.
    branches: [ "feat/seo-static-fiches-final-20261002" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-site-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Archive existing Max videos
        if: github.ref_name == 'feat/v0-magazine'
        run: python scripts/archive-max-videos.py
      - name: Validate homepage and Magazine invariants
        if: github.ref_name == 'feat/v0-magazine'
        run: |
          node scripts/audit-content-duplicates.js
          node scripts/test-home-magazine.js
          node scripts/test-magazine-videos.js
      - name: Generate and verify current fast corpus
        run: |
          node scripts/build-corpus-production.js --publish
          node scripts/test-corpus-bundle-equivalence.js
      - name: Generate crawlable fiche pages
        run: |
          node scripts/build-static-seo-fiches.js
          node scripts/test-fiche-fast-load.js
      - name: Rebuild sitemap
        run: node scripts/build-sitemap-from-corpus.js
      - name: Validate output
        run: |
          test -d fiches-seo
          test "$(find fiches-seo -name '*.html' | wc -l)" -gt 250
          grep -q '<h1>' fiches-seo/*.html
          grep -q 'fiches-seo/' sitemap.xml
          ! grep -q 'fiche.html?id=' sitemap.xml
      - name: Commit generated SEO pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiches-seo fiches-data corpus-production.js corpus-loader.js index.html fiches.html fiche.html sitemap.xml assets/videos
          git diff --cached --quiet || git commit -m "seo: generate static crawlable fiche pages"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME"
            # Preserve concurrent commits; a conflict aborts rather than overwrite.
            git rebase "origin/$GITHUB_REF_NAME" || exit 1
            sleep 2
          done
          exit 1
