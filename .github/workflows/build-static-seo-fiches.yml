name: Build static SEO fiches

on:
  push:
    branches: [ "feat/v0-magazine", "feat/seo-static-fiches-final-20261002" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Archive existing Max videos
        if: github.ref_name == 'feat/v0-magazine'
        run: python scripts/archive-max-videos.py
      - name: Validate homepage and Magazine invariants
        if: github.ref_name == 'feat/v0-magazine'
        run: |
          node scripts/test-home-magazine.js
          node scripts/test-magazine-videos.js
      - name: Generate crawlable fiche pages
        run: node scripts/build-static-seo-fiches.js
      - name: Rebuild sitemap
        run: node scripts/build-sitemap-from-corpus.js
      - name: Validate output
        run: |
          test -d fiches-seo
          test "$(find fiches-seo -name '*.html' | wc -l)" -gt 250
          grep -q '<h1>' fiches-seo/*.html
          grep -q 'fiches-seo/' sitemap.xml
          ! grep -q 'fiche.html?id=' sitemap.xml
      - name: Commit generated SEO pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiches-seo sitemap.xml assets/videos
          git diff --cached --quiet || git commit -m "seo: generate static crawlable fiche pages"
          git push
