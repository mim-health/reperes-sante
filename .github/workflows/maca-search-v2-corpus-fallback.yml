name: MACA Search V2 Corpus Coverage

on:
  pull_request:
    branches:
      - feat/v0-magazine
    paths:
      - search-v2-corpus-fallback.js
      - corpus-v2-browser-entry.js
      - assistant-alpha.html
      - search-v2-corpus-fallback-functional.html
      - search-v2-full-corpus-audit.html
      - corpus-manifest.js
      - corpus-canonicalizer.js
      - maca-multi-sections.js
      - search-v2-referential-p0.js
      - search-v2-engine.js
      - search-v2-tests-p0.js
      - backlog-audited-prevention-urologie-senior-femme-2026-09-01.js
      - backlog-audited-urologie-sexologie-femme-senior-lot2-2026-09-01.js
      - backlog-audited-femme-senior-ophtalmo-douleurs-lot3-2026-09-01.js
      - backlog-audited-orl-ophtalmo-articulations-lot4-2026-09-01.js
      - backlog-audited-fievre-goutte-zona-cancer-lot5-2026-09-01.js
      - backlog-audited-sante-quotidien-medocs-ophtalmo-bucco-2026-09-01.js
      - maca-card-sources-ui.js
      - .github/workflows/maca-search-v2-corpus-fallback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maca-corpus-fallback-http.log 2>&1 &
          sleep 1

      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "No Chrome/Chromium executable found"; exit 2; }
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Preserve 120 P0 regression tests
        run: |
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=20000 --dump-dom \
            "http://127.0.0.1:8765/search-v2-lab.html?autorun=1" > /tmp/v2-regression.html
          python3 - <<'PY'
          import html, json, re, sys
          dom=open('/tmp/v2-regression.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="machine-result"[^>]*>(.*?)</pre>',dom,re.S)
          if not m: print('Machine result missing'); sys.exit(1)
          data=json.loads(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip())
          print('V2_P0='+json.dumps(data,ensure_ascii=False))
          if not (data.get('ready') and data.get('total')==120 and data.get('failed')==0): sys.exit(1)
          PY

      - name: Validate curated corpus cases
        run: |
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=25000 --dump-dom \
            "http://127.0.0.1:8765/search-v2-corpus-fallback-functional.html" > /tmp/corpus-fallback.html
          python3 - <<'PY'
          import html, json, re, sys
          dom=open('/tmp/corpus-fallback.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="machine-result"[^>]*>(.*?)</pre>',dom,re.S)
          if not m: print('Corpus fallback result missing'); sys.exit(1)
          data=json.loads(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip())
          print('CORPUS_FALLBACK='+json.dumps(data,ensure_ascii=False))
          if not (data.get('ready') and data.get('success') and data.get('total')==47 and data.get('failed')==0 and data.get('corpusCount',0)>0): sys.exit(1)
          PY

      - name: Audit every routable canonical fiche
        run: |
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=35000 --dump-dom \
            "http://127.0.0.1:8765/search-v2-full-corpus-audit.html" > /tmp/full-corpus-audit.html
          python3 - <<'PY'
          import html, json, re, sys
          dom=open('/tmp/full-corpus-audit.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="machine-result"[^>]*>(.*?)</pre>',dom,re.S)
          if not m: print('Full corpus audit result missing'); sys.exit(1)
          data=json.loads(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip())
          print('FULL_CORPUS_AUDIT='+json.dumps(data,ensure_ascii=False))
          title=data.get('titleCoverage',{})
          probes=data.get('probeCoverage',{})
          print(f"Coverage: corpus={data.get('corpusCount')} routable={data.get('routableCount')} excluded={data.get('excludedCount')} title={title.get('passed')}/{data.get('routableCount')} probes={probes.get('passed')}/{data.get('routableCount')}")
          if not data.get('success'):
              print('TITLE_FAILURES='+json.dumps(title.get('failures',[]),ensure_ascii=False))
              print('PROBE_FAILURES='+json.dumps(probes.get('failures',[]),ensure_ascii=False))
              sys.exit(1)
          PY
