name: temp live patient language isolated
on:
  push:
    branches: [chore/live-verify-patient-language-20261005]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live patient-language retrieval with pacing
        run: |
          node - <<'NODE'
          const endpoint='https://purple-voice-a8e3.dr-beddok.workers.dev/';
          const cases=[
            ['nycturie','nycturie-levers-nocturnes-uriner'],
            ['sciatique IRM','sciatique-irm-quand'],
            ['saignement après ménopause','saignement-apres-menopause']
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<cases.length;i++){
            const [question,expectedId]=cases[i];
            let d,r;
            for(let attempt=1;attempt<=2;attempt++){
              r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://macasante.fr'},body:JSON.stringify({question})});
              d=await r.json().catch(()=>({}));
              console.log(JSON.stringify({question,attempt,http:r.status,status:d.status,error:d.error,artifact_version:d?.meta?.artifact_version,cards_used:d.cards_used,selected_cards:d.selected_cards}));
              if(r.status!==503) break;
              await sleep(15000);
            }
            if(!r.ok) throw new Error(question+': HTTP '+r.status+' '+JSON.stringify(d));
            const selected=(d.selected_cards||[]).find(x=>x.id===expectedId);
            const used=(d.cards_used||[]).find(x=>x.id===expectedId);
            if(!selected) throw new Error(question+': expected card not selected');
            if(!used) throw new Error(question+': expected card not used');
            if(!(selected.retrieval_level<=3) || !selected.matched_alias) throw new Error(question+': deterministic retrieval inactive');
            if(i<cases.length-1) await sleep(15000);
          }
          NODE
