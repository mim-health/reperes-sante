name: P0 isolated access and readiness
on:
  push:
    branches: [test/p0-isolated-access-20261014]
    paths: ['.github/workflows/p0-isolated-access.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check credential availability without revealing values
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json
          names={'CLOUDFLARE_API_TOKEN':'CF_TOKEN','CLOUDFLARE_ACCOUNT_ID':'CF_ACCOUNT','OPENAI_API_KEY':'AI_KEY'}
          result={name:bool(os.environ.get(env)) for name,env in names.items()}
          print(json.dumps(result))
          with open('access.json','w') as f: json.dump(result,f)
          PY
      - name: Verify Cloudflare account discovery read only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts',headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
          try:
            with urllib.request.urlopen(req,timeout=30) as response: d=json.load(response)
            result={'success':d.get('success'), 'account_count':len(d.get('result',[])), 'errors':[e.get('code') for e in d.get('errors',[])]}
          except urllib.error.HTTPError as e:
            result={'success':False,'http_status':e.code}
          print(json.dumps(result))
          with open('cloudflare-access.json','w') as f: json.dump(result,f)
          PY
      - name: Test disposable Worker permissions and private source access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,uuid
          def call(url,token,method='GET',body=None,ctype=None):
            h={'Authorization':'Bearer '+token,'User-Agent':'maca-p0-isolated-test'}
            if ctype:h['Content-Type']=ctype
            try:
              with urllib.request.urlopen(urllib.request.Request(url,data=body,headers=h,method=method),timeout=30) as r:
                raw=r.read()
                try:d=json.loads(raw)
                except ValueError:d={}
                return r.status,d
            except urllib.error.HTTPError as e:
              return e.code,{}
          result={}
          status,d=call('https://api.cloudflare.com/client/v4/accounts',os.environ['CF_TOKEN'])
          accounts=d.get('result',[])
          if status!=200 or len(accounts)!=1:raise RuntimeError('Account discovery not unambiguous')
          name='maca-p0-permission-'+os.environ['GITHUB_RUN_ID']
          url='https://api.cloudflare.com/client/v4/accounts/'+accounts[0]['id']+'/workers/scripts/'+name
          status,_=call(url,os.environ['CF_TOKEN'])
          result['initial_status']=status
          if status!=404:raise RuntimeError('Refusing to overwrite existing or inaccessible Worker')
          boundary='p0'+uuid.uuid4().hex
          metadata=json.dumps({'main_module':'probe.js','compatibility_date':'2026-09-22','bindings':[]})
          code='export default {fetch(){return new Response("MACA P0 disposable permissions probe");}};'
          body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{metadata}\r\n--{boundary}\r\nContent-Disposition: form-data; name="probe.js"; filename="probe.js"\r\nContent-Type: application/javascript+module\r\n\r\n{code}\r\n--{boundary}--\r\n').encode()
          status,d=call(url,os.environ['CF_TOKEN'],'PUT',body,'multipart/form-data; boundary='+boundary)
          result['create_status']=status
          created=status==200 and d.get('success') is True
          if created:
            try:
              result['read_back_status']=call(url,os.environ['CF_TOKEN'])[0]
            finally:
              result['delete_status']=call(url,os.environ['CF_TOKEN'],'DELETE')[0]
              result['after_delete_status']=call(url,os.environ['CF_TOKEN'])[0]
          result['private_repo_read_status']=call('https://api.github.com/repos/mim-health/maca-sante-private/contents/assistant-v2/cloudflare-worker-public.js?ref=bf58e59e87071e17ad3931619fbecfe22cbe43a9',os.environ['GH_TOKEN'])[0]
          print(json.dumps(result))
          with open('isolated-permissions.json','w') as f:json.dump(result,f)
          if created and (result.get('delete_status')!=200 or result.get('after_delete_status')!=404):raise RuntimeError('Disposable cleanup requires attention')
          PY
      - name: Read production readiness without deployment
        shell: bash
        run: |
          curl --fail-with-body --connect-timeout 15 --max-time 45 --silent --show-error 'https://purple-voice-a8e3.dr-beddok.workers.dev/?maca_public_ready=1' -o readiness.json
          python3 - <<'PY'
          import json
          d=json.load(open('readiness.json'))
          print(json.dumps(d,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-access-readiness
          path: |
            access.json
            cloudflare-access.json
            readiness.json
            isolated-permissions.json
