name: MACA Temp Sitemap Sync

on:
  push:
    branches:
      - feat/search-v2-ui-20260831
    paths:
      - .github/workflows/maca-sync-sitemap-temp.yml

permissions:
  contents: write

jobs:
  sync-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-v2-ui-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical sitemap
        env:
          SITEMAP_DATE: '2026-08-25'
        run: node scripts/generate-sitemap.js
      - name: Commit generated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore: synchroniser sitemap avec corpus canonique [skip ci]"
          git push origin HEAD:feat/search-v2-ui-20260831
